<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LearnLang — Connexion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<style>
  body{
    display:flex; align-items:center; justify-content:center; overflow-x:hidden;
    position:relative;
  }
  .blob{
    position:fixed; border-radius:50%; filter:blur(60px); opacity:.5; z-index:0;
    animation:float 16s ease-in-out infinite;
  }
  .blob.b1{width:420px;height:420px; background:var(--accent-soft); top:-120px; left:-120px;}
  .blob.b2{width:380px;height:380px; background:var(--amber-soft); bottom:-140px; right:-100px; animation-delay:-6s;}
  .blob.b3{width:280px;height:280px; background:var(--plum-soft); top:40%; right:8%; animation-delay:-11s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-24px) scale(1.06);}
  }
  .auth-wrap{position:relative; z-index:1; width:100%; max-width:400px; padding:20px;}
  .logo-badge{
    width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--amber)); font-size:28px; box-shadow:var(--shadow-glow);
    margin-bottom:18px;
  }
  .auth-card{padding:36px 32px;}
  .flags-strip{display:flex;gap:6px;margin-top:22px;font-size:1.3rem;opacity:.55;letter-spacing:2px;}
  .footnote{text-align:center;color:var(--ink-faint);font-size:.78rem;margin-top:22px;}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="auth-wrap">
  <div class="card auth-card enter">
    <div class="logo-badge">🌐</div>
    <h1>LearnLang</h1>
    <div class="sub">Connecte-toi pour continuer ton apprentissage.</div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Identifiant</label>
        <input id="username" name="username" autocomplete="username" required style="width:100%">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required style="width:100%">
      </div>
      <button type="submit" style="width:100%;justify-content:center;">Se connecter →</button>
      <div class="error" id="err"></div>
    </form>
    <div class="flags-strip">🇪🇸 🇬🇧 · · ·</div>
  </div>
  <div class="footnote">Ta plateforme de langues, chez toi.</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Erreur de connexion.'; return; }
    if (data.role === 'admin') window.location.href = '/admin/';
    else window.location.href = '/app/';
  } catch (err) {
    errEl.textContent = 'Impossible de contacter le serveur.';
  }
});

fetch('/api/me').then((r) => r.ok ? r.json() : null).then((user) => {
  if (user) window.location.href = user.role === 'admin' ? '/admin/' : '/app/';
});
</script>
</body>
</html>
