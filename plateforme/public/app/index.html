<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LearnLang — Tableau de bord</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../style.css">
<style>
  .hero{
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:32px; flex-wrap:wrap;
  }
  .hero h1{font-size:2.1rem;}
  .due-banner{
    background:linear-gradient(120deg, var(--accent) 0%, var(--accent-strong) 100%);
    color:#fff8f4; border-radius:var(--radius-lg); padding:22px 26px; margin-bottom:26px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    box-shadow:var(--shadow-glow);
  }
  .due-banner .big{font-family:'Fraunces',serif; font-size:1.6rem; font-weight:700;}
  .lang-card{padding:0; overflow:hidden;}
  .lang-head{
    display:flex; align-items:center; gap:20px; padding:26px 28px; border-bottom:1px solid rgba(43,33,29,.06);
  }
  .ring-wrap{position:relative; flex-shrink:0; width:76px; height:76px;}
  .ring-wrap .ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; color:var(--ink);
  }
  .lang-title{display:flex; align-items:center; gap:10px; margin:0;}
  .lang-flag{font-size:1.8rem;}
  .lang-body{padding:18px 28px 26px;}
  .lesson-num{
    width:32px;height:32px;border-radius:50%;background:var(--card-soft);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0;
  }
  .lesson-item.is-mastered .lesson-num{background:var(--good-soft); color:var(--good-strong);}
  .lesson-item.is-due .lesson-num{background:var(--bad-soft); color:var(--bad);}
  .lesson-item.is-started .lesson-num{background:var(--amber-soft); color:var(--amber-strong);}
  .lesson-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .lesson-main{display:flex;flex-direction:column;min-width:0;}
  .lesson-title-text{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lesson-sub{font-size:.78rem;color:var(--ink-faint);}
  .empty-state{text-align:center;padding:40px 20px;}
  .empty-state .emoji{font-size:2.4rem;margin-bottom:10px;}
</style>
</head>
<body>
<nav class="topbar">
  <div class="brand">🌐 LearnLang</div>
  <div>
    <span class="muted" id="whoami"></span>
    <a href="#" id="changePwdLink">Mot de passe</a>
    <a href="#" id="logoutLink">Déconnexion</a>
  </div>
</nav>
<div class="wrap">
  <div class="hero">
    <div>
      <h1 id="greeting">Bonjour 👋</h1>
      <div class="sub" style="margin-bottom:0">Choisis une langue et reprends où tu en étais.</div>
    </div>
  </div>
  <div id="dueBanner"></div>
  <div id="languages"></div>
</div>

<div id="pwdModal" style="display:none;position:fixed;inset:0;background:rgba(43,33,29,.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:100;">
  <div class="card" style="max-width:360px;">
    <h2>Changer mon mot de passe</h2>
    <div class="field"><label>Mot de passe actuel</label><input id="curPwd" type="password" style="width:100%"></div>
    <div class="field"><label>Nouveau mot de passe</label><input id="newPwd" type="password" style="width:100%"></div>
    <div class="row">
      <button id="pwdSubmit">Valider</button>
      <button class="secondary" id="pwdCancel">Annuler</button>
    </div>
    <div class="error" id="pwdErr"></div>
    <div class="success" id="pwdOk"></div>
  </div>
</div>

<script>
async function api(url, opts) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { window.location.href = '/'; return null; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erreur');
  return data;
}

function pill(text, cls) { return `<span class="pill ${cls || ''}">${text}</span>`; }

function ring(pct, color) {
  const size = 76, stroke = 8, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const offset = c - (Math.min(100, Math.max(0, pct)) / 100) * c;
  return `
    <div class="ring-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(43,33,29,.08)" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
          data-target-offset="${offset}"
          transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)"/>
      </svg>
      <div class="ring-label">${pct}%</div>
    </div>`;
}

function animateRings() {
  requestAnimationFrame(() => {
    document.querySelectorAll('circle[data-target-offset]').forEach((c) => {
      c.style.strokeDashoffset = c.getAttribute('data-target-offset');
    });
  });
}

async function load() {
  const me = await api('/api/me');
  if (!me) return;
  document.getElementById('whoami').textContent = `${me.display_name} (${me.username})`;
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Bonjour' : hour < 18 ? 'Bon après-midi' : 'Bonsoir';
  document.getElementById('greeting').textContent = `${greet}, ${me.display_name.split(' ')[0]} 👋`;

  const languages = await api('/api/languages');
  const container = document.getElementById('languages');
  container.innerHTML = '';
  let grandTotalDue = 0;

  if (languages.length === 0) {
    container.innerHTML = `
      <div class="card empty-state enter">
        <div class="emoji">📭</div>
        <h2>Aucune langue disponible pour l'instant</h2>
        <p class="muted">Ton administrateur ne t'a pas encore donné accès à un cours.<br>Demande-lui de t'assigner une langue depuis son panel.</p>
      </div>`;
    return;
  }

  for (const lang of languages) {
    const lessons = await api(`/api/languages/${lang.id}/lessons`);
    const totalMastered = lessons.reduce((s, l) => s + l.masteredCount, 0);
    const totalSeen = lessons.reduce((s, l) => s + l.seenCount, 0);
    const totalQ = lessons.reduce((s, l) => s + l.totalQuestions, 0);
    const totalDue = lessons.reduce((s, l) => s + l.dueCount, 0);
    grandTotalDue += totalDue;
    const pct = totalQ ? Math.round((totalMastered / totalQ) * 100) : 0;

    const card = document.createElement('div');
    card.className = 'card lang-card enter';
    card.innerHTML = `
      <div class="lang-head">
        ${ring(pct, '#d9502f')}
        <div style="flex:1;min-width:0;">
          <h2 class="lang-title"><span class="lang-flag">${lang.flag_emoji}</span> ${lang.name}</h2>
          <div class="muted">${totalMastered}/${totalQ} maîtrisées · ${totalSeen}/${totalQ} vues</div>
        </div>
        <div>${totalDue > 0 ? pill('🔥 ' + totalDue + ' à réviser', 'due') : pill('✓ à jour', 'mastered')}</div>
      </div>
      <div class="lang-body"><ul class="lesson-list"></ul></div>
    `;
    const ul = card.querySelector('.lesson-list');
    lessons.forEach((l, idx) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      const lpct = l.totalQuestions ? Math.round((l.masteredCount / l.totalQuestions) * 100) : 0;
      let statusClass = '';
      let statusLabel = 'Pas commencé';
      if (lpct >= 80) { statusClass = ' is-mastered'; statusLabel = 'Maîtrisé'; }
      else if (l.seenCount > 0) { statusClass = ' is-started'; statusLabel = 'En cours'; }
      if (l.dueCount > 0) statusClass = ' is-due';
      a.className = 'lesson-item' + statusClass;
      a.href = `lesson.html?id=${l.id}`;
      a.innerHTML = `
        <span class="lesson-left">
          <span class="lesson-num">${idx + 1}</span>
          <span class="lesson-main">
            <span class="lesson-title-text">${l.title}</span>
            <span class="lesson-sub">${statusLabel} · ${l.seenCount}/${l.totalQuestions} vues</span>
          </span>
        </span>
        <span style="display:flex;gap:8px;flex-shrink:0;">${l.dueCount > 0 ? pill(l.dueCount + ' due', 'due') : ''}${pill(lpct + '%', lpct >= 80 ? 'mastered' : '')}</span>
      `;
      li.appendChild(a);
      ul.appendChild(li);
    });
    container.appendChild(card);
  }

  const banner = document.getElementById('dueBanner');
  if (grandTotalDue > 0) {
    banner.innerHTML = `
      <div class="due-banner enter">
        <div>
          <div class="big">🔥 ${grandTotalDue} question${grandTotalDue > 1 ? 's' : ''} à réviser aujourd'hui</div>
          <div style="opacity:.85;font-size:.92rem;margin-top:4px">La répétition espacée marche mieux si tu ne laisses pas traîner !</div>
        </div>
      </div>`;
  }

  animateRings();
}

document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await api('/api/logout', { method: 'POST' });
  window.location.href = '/';
});

const modal = document.getElementById('pwdModal');
document.getElementById('changePwdLink').addEventListener('click', (e) => {
  e.preventDefault();
  modal.style.display = 'flex';
});
document.getElementById('pwdCancel').addEventListener('click', () => (modal.style.display = 'none'));
document.getElementById('pwdSubmit').addEventListener('click', async () => {
  const currentPassword = document.getElementById('curPwd').value;
  const newPassword = document.getElementById('newPwd').value;
  const errEl = document.getElementById('pwdErr');
  const okEl = document.getElementById('pwdOk');
  errEl.textContent = ''; okEl.textContent = '';
  try {
    await api('/api/me/password', { method: 'POST', body: JSON.stringify({ currentPassword, newPassword }) });
    okEl.textContent = 'Mot de passe mis à jour.';
    setTimeout(() => (modal.style.display = 'none'), 1200);
  } catch (err) {
    errEl.textContent = err.message;
  }
});

load();
</script>
</body>
</html>
