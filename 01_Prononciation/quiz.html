<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quiz — Prononciation espagnole</title>
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --accent:#d94f30; --accent2:#f2a922;
    --good:#3e8e5a; --bad:#c0392b; --text:#3a2e2a; --muted:#8a7a72;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,#fdf6ec,#fbe8d3);
    color:var(--text); margin:0; padding:32px 16px; min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:1.5rem;margin-bottom:4px;}
  .sub{color:var(--muted);margin-bottom:24px;}
  .card{
    background:var(--card); border-radius:16px; padding:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.08); margin-bottom:16px;
  }
  .qnum{font-size:.85rem;color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
  .qtext{font-size:1.15rem;font-weight:600;margin-bottom:16px;}
  .opt{
    display:block; width:100%; text-align:left; padding:12px 16px;
    margin-bottom:10px; border-radius:10px; border:2px solid #eee2d5;
    background:#fffdf9; cursor:pointer; font-size:1rem; color:var(--text);
    transition:all .15s;
  }
  .opt:hover{border-color:var(--accent2);}
  .opt.selected{border-color:var(--accent);background:#fdece6;}
  .opt.correct{border-color:var(--good);background:#e7f5ec;}
  .opt.incorrect{border-color:var(--bad);background:#fbe9e7;}
  .explain{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f6f0e6;font-size:.95rem;display:none;}
  .explain.show{display:block;}
  .nextbtn, .restart{
    background:var(--accent); color:white; border:none; padding:12px 22px;
    border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px;
  }
  .nextbtn:disabled{background:#e0d3c4;cursor:not-allowed;}
  .progress{height:8px;background:#eee2d5;border-radius:4px;overflow:hidden;margin-bottom:24px;}
  .progress-bar{height:100%;background:var(--accent2);width:0%;transition:width .3s;}
  .score{text-align:center;}
  .score h2{font-size:2.2rem;margin-bottom:8px;}
  .score p{color:var(--muted);}
  .emoji{font-size:3rem;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 Quiz — Prononciation espagnole</h1>
  <div class="sub">Leçon 1 · 8 questions</div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div id="quizArea"></div>
</div>

<script>
const questions = [
  {
    q: "Comment se prononce le mot « jamón » (jambon) ?",
    options: ["« jamon » comme en français", "« rhamon » (son guttural raclé)", "« yamon »", "« djamon »"],
    answer: 1,
    explain: "Le j espagnol est guttural, raclé au fond de la gorge — jamais le « j » doux du français."
  },
  {
    q: "Le mot « perro » (chien) et « pero » (mais) se distinguent par :",
    options: ["Rien, ça se prononce pareil", "La longueur du r roulé (rr fort vs r simple)", "L'accent tonique uniquement", "La voyelle finale"],
    answer: 1,
    explain: "« rr » est roulé fort et long, « r » simple entre voyelles est bien plus léger. Ce r est roulé avec la pointe de la langue, pas avec la gorge comme en français."
  },
  {
    q: "Comment prononce-t-on le « u » dans « luna » (lune) ?",
    options: ["Comme le « u » français (lune)", "Comme « ou » (loup)", "Il est muet", "Comme « eu »"],
    answer: 1,
    explain: "Le u espagnol se prononce toujours « ou », jamais comme le u français. C'est un des pièges classiques pour un francophone."
  },
  {
    q: "La lettre « ñ » dans « niño » se prononce comme :",
    options: ["Un simple « n »", "« gn » (comme « montagne »)", "« ny » à l'anglaise", "« in »"],
    answer: 1,
    explain: "ñ = « gn », exactement comme le « gn » de montagne en français."
  },
  {
    q: "En espagnol d'Espagne, comment se prononce le « c » dans « cielo » (ciel) ?",
    options: ["« tch » comme dans « tchao »", "« k »", "« th » anglais (think) ou « s » en Amérique latine", "« ch » français"],
    answer: 2,
    explain: "Piège classique : le réflexe naturel serait de dire « k » ou « ch », mais le c devant e/i se prononce « th » (Espagne) ou « s » (Amérique latine)."
  },
  {
    q: "Quelle affirmation est vraie sur les voyelles espagnoles ?",
    options: ["Elles peuvent être nasalisées comme en français", "Elles se prononcent toujours de façon pure et constante", "Elles sont souvent muettes en fin de mot", "Elles varient selon la lettre suivante"],
    answer: 1,
    explain: "a, e, i, o, u ont toujours le même son, jamais nasalisé ni avalé comme en français."
  },
  {
    q: "Où place-t-on les signes ¿ et ¡ ?",
    options: ["Seulement à la fin de la phrase", "Au début ET à la fin de la phrase", "Seulement au début", "Nulle part, ils n'existent pas"],
    answer: 1,
    explain: "Spécificité purement espagnole : ¿Cómo estás? ¡Qué bien! — au début et à la fin."
  },
  {
    q: "Le h dans « hola » (bonjour) se prononce :",
    options: ["Comme un souffle léger", "Il est toujours muet", "Comme le j guttural", "Comme un h aspiré anglais"],
    answer: 1,
    explain: "Le h espagnol est toujours muet, comme en français. « hola » = « ola »."
  }
];

let current = 0, score = 0, answered = false;
const quizArea = document.getElementById('quizArea');
const progressBar = document.getElementById('progressBar');

function render() {
  progressBar.style.width = (current / questions.length * 100) + '%';
  if (current >= questions.length) return renderScore();
  const item = questions[current];
  answered = false;
  quizArea.innerHTML = `
    <div class="card">
      <div class="qnum">Question ${current + 1} / ${questions.length}</div>
      <div class="qtext">${item.q}</div>
      <div id="opts"></div>
      <div class="explain" id="explain">${item.explain}</div>
      <button class="nextbtn" id="nextBtn" disabled>Suivant →</button>
    </div>`;
  const optsDiv = document.getElementById('opts');
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => selectOption(i, btn);
    optsDiv.appendChild(btn);
  });
}

function selectOption(i, btn) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const allOpts = document.querySelectorAll('.opt');
  allOpts.forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add('correct');
    else if (idx === i) b.classList.add('incorrect');
  });
  if (i === item.answer) score++;
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').onclick = () => { current++; render(); };
}

function renderScore() {
  progressBar.style.width = '100%';
  const pct = Math.round(score / questions.length * 100);
  let emoji = '💪', msg = "Continue, ça va venir !";
  if (pct >= 90) { emoji = '🎉'; msg = "Excellent, tu as l'oreille !"; }
  else if (pct >= 70) { emoji = '👏'; msg = "Très bien, presque parfait."; }
  else if (pct >= 50) { emoji = '🙂'; msg = "Pas mal, relis la leçon une fois."; }
  quizArea.innerHTML = `
    <div class="card score">
      <div class="emoji">${emoji}</div>
      <h2>${score} / ${questions.length}</h2>
      <p>${msg}</p>
      <button class="restart" onclick="restart()">Recommencer</button>
    </div>`;
}

function restart() { current = 0; score = 0; render(); }
render();
</script>
</body>
</html>
