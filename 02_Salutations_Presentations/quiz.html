<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quiz — Salutations et présentations</title>
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --accent:#d94f30; --accent2:#f2a922;
    --good:#3e8e5a; --bad:#c0392b; --text:#3a2e2a; --muted:#8a7a72;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,#fdf6ec,#fbe8d3);
    color:var(--text); margin:0; padding:32px 16px; min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:1.5rem;margin-bottom:4px;}
  .sub{color:var(--muted);margin-bottom:24px;}
  .card{background:var(--card); border-radius:16px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,.08); margin-bottom:16px;}
  .qnum{font-size:.85rem;color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
  .qtext{font-size:1.15rem;font-weight:600;margin-bottom:16px;}
  .opt{display:block; width:100%; text-align:left; padding:12px 16px; margin-bottom:10px; border-radius:10px; border:2px solid #eee2d5; background:#fffdf9; cursor:pointer; font-size:1rem; color:var(--text); transition:all .15s;}
  .opt:hover{border-color:var(--accent2);}
  .opt.correct{border-color:var(--good);background:#e7f5ec;}
  .opt.incorrect{border-color:var(--bad);background:#fbe9e7;}
  .explain{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f6f0e6;font-size:.95rem;display:none;}
  .explain.show{display:block;}
  .nextbtn, .restart{background:var(--accent); color:white; border:none; padding:12px 22px; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px;}
  .nextbtn:disabled{background:#e0d3c4;cursor:not-allowed;}
  .progress{height:8px;background:#eee2d5;border-radius:4px;overflow:hidden;margin-bottom:24px;}
  .progress-bar{height:100%;background:var(--accent2);width:0%;transition:width .3s;}
  .score{text-align:center;}
  .score h2{font-size:2.2rem;margin-bottom:8px;}
  .score p{color:var(--muted);}
  .emoji{font-size:3rem;margin-bottom:8px;}
  .fillrow{display:flex;gap:8px;margin-bottom:12px;}
  .fillrow input{flex:1;padding:12px 14px;border-radius:10px;border:2px solid #eee2d5;font-size:1rem;}
  .checkbtn{background:var(--accent2);color:white;border:none;padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>👋 Quiz — Salutations et présentations</h1>
  <div class="sub">Leçon 2 · 8 questions</div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div id="quizArea"></div>
</div>

<script>
const questions = [
  { type:"mcq", q:"Comment dit-on « Bonjour » (le matin) en espagnol ?",
    options:["Buenas noches","Buenos días","Hasta luego","Adiós"], answer:1,
    explain:"Buenos días = bonjour, se dit le matin." },
  { type:"mcq", q:"« Me llamo Mathieu » signifie :",
    options:["J'appelle Mathieu","Je m'appelle Mathieu","Il s'appelle Mathieu","Appelle Mathieu"], answer:1,
    explain:"Structure réfléchie : « me » (pronom réfléchi) + « llamo » (j'appelle) = je m'appelle." },
  { type:"mcq", q:"Quel pronom correspond à « tu » en espagnol ?",
    options:["yo","él","tú","usted"], answer:2,
    explain:"tú = tu (informel)." },
  { type:"mcq", q:"Comment conjugue-t-on SER à la première personne du singulier (yo) ?",
    options:["eres","es","soy","somos"], answer:2,
    explain:"yo soy = je suis. Verbe irrégulier à apprendre par cœur." },
  { type:"mcq", q:"En Amérique latine, quel pronom remplace « vosotros » (vous, pluriel) ?",
    options:["ellos","nosotros","ustedes","tú"], answer:2,
    explain:"En Amérique latine, ustedes sert pour « vous » pluriel, poli ou non — vosotros n'y est pas utilisé." },
  { type:"mcq", q:"Pour dire son âge, quel verbe utilise-t-on en espagnol (contrairement au français) ?",
    options:["ser","estar","tener","haber"], answer:2,
    explain:"Tengo treinta años (littéralement « je tiens 30 ans ») — pas ser, contrairement au réflexe du français « je suis »." },
  { type:"mcq", q:"Le mot espagnol « salir » veut dire :",
    options:["Monter", "Sortir", "Saler", "Sauter"], answer:1,
    explain:"salir = sortir, un verbe de base à retenir dès maintenant." },
  { type:"mcq", q:"« Mucho gusto » se traduit par :",
    options:["Beaucoup de goût", "Enchanté(e)", "Bon appétit", "À bientôt"], answer:1,
    explain:"Mucho gusto = enchanté(e), l'expression classique pour une première rencontre." }
];

let current = 0, score = 0, answered = false;
const quizArea = document.getElementById('quizArea');
const progressBar = document.getElementById('progressBar');

function render() {
  progressBar.style.width = (current / questions.length * 100) + '%';
  if (current >= questions.length) return renderScore();
  const item = questions[current];
  answered = false;
  quizArea.innerHTML = `
    <div class="card">
      <div class="qnum">Question ${current + 1} / ${questions.length}</div>
      <div class="qtext">${item.q}</div>
      <div id="opts"></div>
      <div class="explain" id="explain">${item.explain}</div>
      <button class="nextbtn" id="nextBtn" disabled>Suivant →</button>
    </div>`;
  const optsDiv = document.getElementById('opts');
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => selectOption(i, btn);
    optsDiv.appendChild(btn);
  });
}

function selectOption(i, btn) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const allOpts = document.querySelectorAll('.opt');
  allOpts.forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add('correct');
    else if (idx === i) b.classList.add('incorrect');
  });
  if (i === item.answer) score++;
  document.getElementById('explain').classList.add('show');
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').onclick = () => { current++; render(); };
}

function renderScore() {
  progressBar.style.width = '100%';
  const pct = Math.round(score / questions.length * 100);
  let emoji = '💪', msg = "Continue, ça va venir !";
  if (pct >= 90) { emoji = '🎉'; msg = "Excellent, tu es prêt à te présenter !"; }
  else if (pct >= 70) { emoji = '👏'; msg = "Très bien, presque parfait."; }
  else if (pct >= 50) { emoji = '🙂'; msg = "Pas mal, relis la leçon une fois."; }
  quizArea.innerHTML = `
    <div class="card score">
      <div class="emoji">${emoji}</div>
      <h2>${score} / ${questions.length}</h2>
      <p>${msg}</p>
      <button class="restart" onclick="restart()">Recommencer</button>
    </div>`;
}

function restart() { current = 0; score = 0; render(); }
render();
</script>
</body>
</html>
